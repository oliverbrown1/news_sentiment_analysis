[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "news-signal"
version = "0.1.0"
description = "Financial news sentiment analysis pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lxml-html-clean>=0.4,<1",
    "newsapi-python>=0.2.7,<1",
    "newspaper3k>=0.2.8,<1",
    "nltk>=3.9,<4",
    "python-dotenv>=1.0,<2",
    "torch>=2.6,<3",
    "transformers>=4.50,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
news-signal = "news_signal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
